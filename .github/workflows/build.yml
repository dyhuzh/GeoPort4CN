name: Build GeoPort4CN

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── macOS ARM (Apple Silicon) ──────────────────────────────────────────────
  build-macos-arm:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build .app bundle
        run: |
          pyinstaller \
            --name "GeoPort4CN" \
            --onedir \
            --windowed \
            --icon images/AppIcon.icns \
            --add-data "src/templates:templates" \
            --add-data "images/PayQrcode.png:images" \
            --collect-all pymobiledevice3 \
            --collect-all pytun_pmd3 \
            --collect-all asgiref \
            --collect-data pycountry \
            --copy-metadata Flask \
            --copy-metadata MarkupSafe \
            --copy-metadata apple-compress \
            --copy-metadata click \
            --copy-metadata itsdangerous \
            --copy-metadata pycountry \
            --copy-metadata pyimg4 \
            --copy-metadata readchar \
            --copy-metadata sentry-sdk \
            --copy-metadata urllib3 \
            src/main.py

      - name: Run as background agent (no Dock icon, avoids "Not Responding")
        run: |
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/GeoPort4CN.app/Contents/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :LSUIElement true" dist/GeoPort4CN.app/Contents/Info.plist
          # Editing Info.plist invalidates PyInstaller's signature, which makes
          # the app show as "damaged" on other Macs. Re-apply an ad-hoc signature.
          codesign --force --deep --sign - dist/GeoPort4CN.app
          codesign --verify --deep --strict dist/GeoPort4CN.app

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p dist/dmg_staging
          cp -r dist/GeoPort4CN.app dist/dmg_staging/
          create-dmg \
            --volname "GeoPort4CN" \
            --window-size 660 400 \
            --icon-size 128 \
            --app-drop-link 440 200 \
            dist/GeoPort4CN-macOS-arm64.dmg \
            dist/dmg_staging/ \
          || (cd dist && zip -r GeoPort4CN-macOS-arm64.zip GeoPort4CN.app)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPort4CN-macOS-arm64
          path: dist/GeoPort4CN-macOS-arm64.*

  # ─── macOS Intel ────────────────────────────────────────────────────────────
  # Cross-build x86_64 on an Apple Silicon runner via Rosetta 2 (the native
  # macos-13 Intel runners queue indefinitely for this repo). Uses the python.org
  # universal2 build, whose x86_64 slice targets macOS 10.13+, so the result runs
  # on Intel Macs back to Big Sur and earlier.
  build-macos-intel:
    name: macOS (Intel)
    runs-on: macos-latest
    continue-on-error: true
    env:
      PY_VER: 3.12.7
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Python (python.org universal2)
        run: |
          curl -fL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/${PY_VER}/python-${PY_VER}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          ls -l /usr/local/bin/python3.12

      - name: Create x86_64 venv and install dependencies
        run: |
          arch -x86_64 /usr/local/bin/python3.12 -m venv venv
          arch -x86_64 ./venv/bin/python -m pip install --upgrade pip
          arch -x86_64 ./venv/bin/pip install -r requirements.txt pyinstaller
          echo "Interpreter arch:"
          arch -x86_64 ./venv/bin/python -c "import platform; print(platform.machine())"

      - name: Build .app bundle (x86_64)
        run: |
          arch -x86_64 ./venv/bin/pyinstaller \
            --name "GeoPort4CN" \
            --onedir \
            --windowed \
            --icon images/AppIcon.icns \
            --add-data "src/templates:templates" \
            --add-data "images/PayQrcode.png:images" \
            --collect-all pymobiledevice3 \
            --collect-all pytun_pmd3 \
            --collect-all asgiref \
            --collect-data pycountry \
            --copy-metadata Flask \
            --copy-metadata MarkupSafe \
            --copy-metadata apple-compress \
            --copy-metadata click \
            --copy-metadata itsdangerous \
            --copy-metadata pycountry \
            --copy-metadata pyimg4 \
            --copy-metadata readchar \
            --copy-metadata sentry-sdk \
            --copy-metadata urllib3 \
            src/main.py
          echo "Built binary arch:"
          file dist/GeoPort4CN.app/Contents/MacOS/GeoPort4CN

      - name: Run as background agent (no Dock icon, avoids "Not Responding")
        run: |
          /usr/libexec/PlistBuddy -c "Add :LSUIElement bool true" dist/GeoPort4CN.app/Contents/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :LSUIElement true" dist/GeoPort4CN.app/Contents/Info.plist
          # Editing Info.plist invalidates PyInstaller's signature, which makes
          # the app show as "damaged" on other Macs. Re-apply an ad-hoc signature.
          codesign --force --deep --sign - dist/GeoPort4CN.app
          codesign --verify --deep --strict dist/GeoPort4CN.app

      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p dist/dmg_staging
          cp -r dist/GeoPort4CN.app dist/dmg_staging/
          create-dmg \
            --volname "GeoPort4CN" \
            --window-size 660 400 \
            --icon-size 128 \
            --app-drop-link 440 200 \
            dist/GeoPort4CN-macOS-x64.dmg \
            dist/dmg_staging/ \
          || (cd dist && zip -r GeoPort4CN-macOS-x64.zip GeoPort4CN.app)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPort4CN-macOS-x64
          path: dist/GeoPort4CN-macOS-x64.*

  # ─── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller pyuac pywin32 Pillow

      - name: Create .ico icon
        run: |
          python -c "
          from PIL import Image
          img = Image.open('images/AppIcon.png').convert('RGBA')
          sizes = [(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)]
          img.save('GeoPort4CN.ico', format='ICO', sizes=sizes)
          "

      - name: Build executable
        shell: bash
        run: |
          pyinstaller \
            --name "GeoPort4CN" \
            --onefile \
            --uac-admin \
            --icon GeoPort4CN.ico \
            --add-data "src/templates;templates" \
            --add-data "images/PayQrcode.png;images" \
            --collect-all pymobiledevice3 \
            --collect-all pytun_pmd3 \
            --collect-all asgiref \
            --collect-data pycountry \
            --copy-metadata Flask \
            --copy-metadata MarkupSafe \
            --copy-metadata click \
            --copy-metadata itsdangerous \
            --copy-metadata pycountry \
            --copy-metadata pyimg4 \
            --copy-metadata readchar \
            --copy-metadata sentry-sdk \
            --copy-metadata urllib3 \
            src/main.py

      - name: Rename executable for release
        shell: bash
        run: mv dist/GeoPort4CN.exe dist/GeoPort4CN-Windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoPort4CN-Windows-x64
          path: dist\GeoPort4CN-Windows-x64.exe

  # ─── GitHub Release (only on version tags) ──────────────────────────────────
  release:
    name: Create Release
    needs: [build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    # always() so a single platform's build failure still publishes a release
    # with whatever artifacts did succeed, instead of blocking everything.
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Delete any existing release for this tag first so stale assets from
      # earlier runs (e.g. old naming schemes) don't accumulate. Keep the tag.
      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag=false || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
